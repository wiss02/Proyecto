{% extends "baseMProyecto.html" %}
{% load static %}

{% block titulo %}{{ articulo.titulo }} - Blog{% endblock %}

{% block cuerpo %}

<div class="container mt-4">
    <article class="blog-post">
        <h1 class="display-5 link-body-emphasis mb-1">{{ articulo.titulo }}</h1>
        <p class="blog-post-meta text-muted">
            Publicado el {{ articulo.fecha_publicacion|date:"d \d\e F \d\e Y, H:i" }}
        </p>

        <div class="contenido-articulo mt-4">
            {{ articulo.contenido|safe }}
        </div>
    </article>

    <hr class="my-4">

    <a href="{% url 'listar_articulos' %}" class="btn btn-outline-secondary">&laquo; Volver al Blog</a>
</div>
{% endblock %}
